name: Funny Cartoon Video Generator (Test Mode)

on:
  workflow_dispatch:  # मैन्युअली रन करने के लिए

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 150 
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        
    - name: Install Python Libraries
      run: |
        pip install --upgrade pip
        pip install pygame moviepy==1.0.3 edge-tts numpy opencv-python-headless

    - name: Run Cartoon Video Bot
      run: |
        python bot.py

    - name: Upload Video for Download
      uses: actions/upload-artifact@v4
      with:
        name: Cartoon-Joke-Video
        path: output/FINAL_UPLOAD.mp4

    - name: Commit updated jokes.txt
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add jokes.txt
        git commit -m "🤖 [TEST] जोक यूज़ किया गया और Text File अपडेट की गई" || echo "No changes to commit"
        git push
